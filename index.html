<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מפת אזעקות חיה</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="client/css/style.css">
    <!-- לוח הצלילים -->
    <link rel="stylesheet" href="client/css/soundPanel.css">
    <!-- צ'אט -->
    <link rel="stylesheet" href="client/css/chat.css">
</head>
<body>

    <div id="map"></div>

    <!-- פאנל צף -->
    <div id="floating-panel" class="expanded">
        <div class="panel-header">
            <h2>התרעות ב-24 שעות האחרונות</h2>
            <button id="toggle-btn">▼</button>
        </div>
        <div id="alert-list"></div>
        <div class="panel-footer">
            <div autocomplete="off">
                <!-- dummy hidden fields to prevent Chrome autofill -->
                <input type="text" style="display:none" aria-hidden="true">
                <input type="password" style="display:none" aria-hidden="true">
                <input id="city-search" type="search"
                       placeholder="חיפוש יישוב..."
                       autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
            </div>
        </div>
    </div>

    <!-- כפתור FAB (מוסתר בהתחלה) -->
    <div id="fab-button">
        <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
        <div id="fab-badge">!</div>
    </div>

    <!-- כפתור משתמש -->
   <div id="auth-button" style="visibility:hidden">כניסת משתמש</div>

    <!-- Modal התחברות -->
    <div id="auth-modal" class="hidden">
        <div class="auth-content">
            <span class="close-btn" onclick="closeAuthModal()">&times;</span>
            <div class="auth-tabs">
                <button id="tab-login" class="active" onclick="switchAuthTab('login')">משתמש קיים</button>
                <button id="tab-register" onclick="switchAuthTab('register')">משתמש חדש</button>
            </div>
            <div id="form-login" class="auth-form">
                <input type="text" id="login-user" placeholder="שם משתמש">
                <input type="password" id="login-pass" placeholder="סיסמה">
                <button class="submit-btn" onclick="submitAuth('login')">היכנס</button>
                <div class="auth-divider"><span>או</span></div>
                <button class="google-btn" onclick="loginWithGoogle()">
                    <svg viewBox="0 0 48 48" width="18" height="18"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg>
                    התחבר עם Google
                </button>
            </div>
            <div id="form-register" class="auth-form hidden">
                <input type="text" id="reg-user" placeholder="בחר שם משתמש">
                <input type="password" id="reg-pass" placeholder="סיסמה">
                <input type="password" id="reg-pass2" placeholder="אימות סיסמה">
                <button class="submit-btn" onclick="submitAuth('register')">צור משתמש</button>
                <div class="auth-divider"><span>או</span></div>
                <button class="google-btn" onclick="loginWithGoogle()">
                    <svg viewBox="0 0 48 48" width="18" height="18"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg>
                    הירשם עם Google
                </button>
            </div>
            <div id="auth-msg"></div>
        </div>
    </div>

    <!-- פאנל משתמש -->
    <div id="user-panel" class="hidden">
        <div class="user-panel-content">
            <span class="close-btn user-panel-close" onclick="closeUserPanel()">&times;</span>
            <div class="user-panel-body">
                <!-- תוכן עתידי -->
            </div>
            <div class="user-panel-footer">
                <button class="user-panel-logout-btn" onclick="logout()">יציאה</button>
            </div>
        </div>
    </div>

    <!-- ספריות -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!--
        סדר הטעינה חשוב!
        1. map.js       – מגדיר drawCityOnMap, updateMapFromServer, syncAllGlows
        2. ui.js        – מגדיר mergeHistoryForDisplay, renderAlertList
        3. panel.js     – מגדיר isPanelHidden, toggleCollapse וכו'
        4. auth.js      – מגדיר openAuthModal, submitAuth וכו'
        5. soundPanel.js– לוח הצלילים (לפני main.js!)
        6. chat.js      – פאנל צ'אט (לפני main.js!)
        7. main.js      – משתמש בכולם, מתחיל את ה-polling
    -->
    <script src="client/js/config.client.js"></script>
    <script src="client/js/map.js"></script>
    <script src="client/js/ui.js"></script>
    <script src="client/js/panel.js"></script>
    <script src="client/js/auth.js"></script>
    <script src="client/js/soundPanel.js"></script>
    <script src="client/js/chat.js"></script>
    <script src="client/js/presence.js"></script>
    <script src="client/js/main.js"></script>
</body>
</html>
