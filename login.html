<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>התחברות / הרשמה</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1e1f22; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #2b2d31; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 300px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; background: #1e1f22; color: white; }
        button { width: 100%; padding: 10px; margin-top: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-login { background: #388e3c; color: white; }
        .btn-register { background: #555; color: white; }
        #message { margin-top: 15px; font-size: 0.9em; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>ברוכים הבאים</h2>
        <input type="text" id="username" placeholder="שם משתמש">
        <input type="password" id="password" placeholder="סיסמה">
        
        <button class="btn-login" onclick="handleAuth('login')">התחבר</button>
        <button class="btn-register" onclick="handleAuth('register')">הרשמה</button>

        <div id="message"></div>
    </div>

    <script>
        async function handleAuth(action) {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');

            if (!username || !password) {
                messageDiv.innerText = "נא להזין שם משתמש וסיסמה";
                messageDiv.style.color = "red";
                return;
            }

            try {
                const response = await fetch(`http://localhost:3000/api/auth/${action}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    messageDiv.innerText = data.message;
                    messageDiv.style.color = "#388e3c";
                    // בשלב הבא נוכל להעביר את המשתמש לדף המפה או הצ'אט!
                    if (action === 'login') {
                        localStorage.setItem('currentUser', data.username); // שומרים בדפדפן מי מחובר
                        setTimeout(() => window.location.href = 'index.html', 1500);
                    }
                } else {
                    messageDiv.innerText = data.error;
                    messageDiv.style.color = "red";
                }
            } catch (err) {
                messageDiv.innerText = "שגיאת תקשורת עם השרת";
                messageDiv.style.color = "red";
            }
        }
    </script>
</body>
</html>
